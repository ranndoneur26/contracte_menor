<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ContratoMenor.app — Gestió de contractes menors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3EEE3;
  --paper-deep:#EAE2CE;
  --card:#FBF8F1;
  --ink:#241F17;
  --ink-soft:#5A5142;
  --navy:#132038;
  --navy-2:#1B2E4C;
  --navy-3:#24406A;
  --gold:#A9813F;
  --gold-light:#D8BE84;
  --green:#3E6B4C;
  --green-bg:#E6EEE4;
  --amber:#9C6B24;
  --amber-bg:#F3E6CC;
  --red:#933A34;
  --red-bg:#F3DEDA;
  --line:#D9CFB6;
  --line-strong:#C3B693;
  --white:#FFFDF8;
  --font-serif:'Source Serif 4', Georgia, 'Iowan Old Style', serif;
  --font-sans:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, monospace;
  --radius-s:3px;
  --radius-m:5px;
  --shadow-1: 0 1px 2px rgba(19,32,56,0.06);
  --shadow-2: 0 6px 20px rgba(19,32,56,0.14);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-sans);
  background:var(--paper);
  color:var(--ink);
  font-size:14.5px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-serif); font-weight:600; margin:0; color:var(--navy);}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--gold-light); color:var(--navy);}
:focus-visible{outline:2px solid var(--navy-3); outline-offset:2px;}

/* ---------- Layout shell ---------- */
#app{display:flex; min-height:100vh;}

.sidebar{
  width:248px; flex-shrink:0; background:var(--navy);
  color:#DCE3EE; display:flex; flex-direction:column;
  position:fixed; top:0; left:0; bottom:0; overflow-y:auto;
}
.sidebar-brand{
  padding:24px 22px 18px; border-bottom:1px solid rgba(255,255,255,0.09);
}
.sidebar-brand .mark{
  font-family:var(--font-serif); font-size:20px; font-weight:600; color:var(--white); letter-spacing:0.01em;
}
.sidebar-brand .mark em{color:var(--gold-light); font-style:normal;}
.sidebar-brand .sub{font-size:11.5px; color:#93A1BC; margin-top:4px;}
.sidebar-entidad{
  padding:16px 22px; border-bottom:1px solid rgba(255,255,255,0.09);
  font-size:12px; color:#A9B4CB; line-height:1.55;
}
.sidebar-entidad strong{display:block; color:#EDF1F8; font-size:13px; font-weight:600; margin-bottom:2px; font-family:var(--font-serif);}
.nav-group{padding:14px 12px;}
.nav-group-label{font-size:10.5px; text-transform:uppercase; letter-spacing:0.09em; color:#7686A3; padding:8px 10px 6px;}
.nav-item{
  display:flex; align-items:center; gap:10px; width:100%;
  padding:9px 12px; border-radius:var(--radius-m); border:none; background:none;
  color:#C4CDDF; font-size:13.5px; text-align:left; cursor:pointer;
  transition:background .12s ease, color .12s ease;
}
.nav-item:hover{background:rgba(255,255,255,0.06); color:#fff;}
.nav-item.active{background:var(--navy-3); color:#fff; box-shadow:inset 3px 0 0 var(--gold-light);}
.nav-item .ico{width:17px; text-align:center; opacity:.9; font-family:var(--font-mono); font-size:12px;}
.sidebar-footer{margin-top:auto; padding:16px 22px; font-size:11px; color:#6E7C99; border-top:1px solid rgba(255,255,255,0.09);}

.main{margin-left:248px; flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  height:62px; background:var(--white); border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 26px; position:sticky; top:0; z-index:20;
}
.topbar-title{font-family:var(--font-serif); font-size:18px; color:var(--navy); font-weight:600;}
.topbar-sub{font-size:12px; color:var(--ink-soft); margin-top:1px;}
.topbar-right{display:flex; align-items:center; gap:14px;}
.badge-user{
  display:flex; align-items:center; gap:9px; padding:6px 12px 6px 6px;
  border:1px solid var(--line); border-radius:20px; background:var(--paper);
}
.badge-user .avatar{
  width:26px; height:26px; border-radius:50%; background:var(--navy); color:var(--gold-light);
  display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; font-family:var(--font-serif);
}
.badge-user .who{font-size:12.5px; line-height:1.25;}
.badge-user .who small{display:block; color:var(--ink-soft); font-size:10.5px;}

.content{padding:26px 30px 60px; max-width:1280px;}

/* ---------- Common components ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:9px 17px; border-radius:20px; border:1px solid var(--navy);
  background:var(--navy); color:#fff; font-size:13px; font-weight:600; cursor:pointer;
  transition:transform .08s ease, background .12s ease, box-shadow .12s ease;
}
.btn:hover{background:var(--navy-2);}
.btn:active{transform:translateY(1px);}
.btn.secondary{background:transparent; color:var(--navy); border:1px solid var(--line-strong);}
.btn.secondary:hover{background:var(--paper-deep);}
.btn.gold{background:var(--gold); border-color:var(--gold);}
.btn.gold:hover{background:#96712F;}
.btn.danger{background:transparent; color:var(--red); border:1px solid var(--red);}
.btn.danger:hover{background:var(--red-bg);}
.btn.small{padding:6px 12px; font-size:12px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

.panel{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-m); box-shadow:var(--shadow-1);}
.panel-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 20px; border-bottom:1px solid var(--line);
}
.panel-head h3{font-size:15.5px;}
.panel-head .hint{font-size:11.5px; color:var(--ink-soft); font-weight:400; font-family:var(--font-sans); margin-top:2px;}
.panel-body{padding:18px 20px;}

.grid-kpi{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px;}
@media (max-width:1080px){.grid-kpi{grid-template-columns:repeat(2,1fr);}}
.kpi{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius-m);
  padding:16px 18px; position:relative; overflow:hidden;
}
.kpi::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--gold);}
.kpi .label{font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em;}
.kpi .value{font-family:var(--font-serif); font-size:26px; color:var(--navy); margin-top:6px; font-weight:600;}
.kpi .foot{font-size:11.5px; color:var(--ink-soft); margin-top:5px;}
.kpi.alert::before{background:var(--red);}
.kpi.ok::before{background:var(--green);}

.chip{
  display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px;
  font-size:11px; font-weight:600; letter-spacing:.02em; white-space:nowrap;
}
.chip.borrador{background:#E7E2D4; color:#6B6250;}
.chip.en_tramite{background:#DDE6F2; color:#2A4E7C;}
.chip.aprobado{background:var(--amber-bg); color:var(--amber);}
.chip.publicado{background:#DCE9F5; color:#245A8F;}
.chip.registrado{background:var(--green-bg); color:var(--green);}
.chip.bloqueante{background:var(--red-bg); color:var(--red);}
.chip.aviso{background:var(--amber-bg); color:var(--amber);}
.chip.info{background:#DDE6F2; color:#2A4E7C;}
.chip.ok{background:var(--green-bg); color:var(--green);}

table{width:100%; border-collapse:collapse; font-size:13px;}
th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em;
  color:var(--ink-soft); font-weight:600; padding:8px 12px; border-bottom:1px solid var(--line-strong);
}
td{padding:11px 12px; border-bottom:1px solid var(--line);}
tr:last-child td{border-bottom:none;}
tbody tr{transition:background .1s ease;}
tbody tr:hover{background:var(--paper);}
.num{font-variant-numeric:tabular-nums; text-align:right;}
.tright{text-align:right;}

.field{margin-bottom:16px;}
.field label{display:block; font-size:12px; font-weight:600; color:var(--navy); margin-bottom:6px;}
.field .desc{font-size:11.5px; color:var(--ink-soft); margin-top:5px;}
.field input[type=text], .field input[type=number], .field input[type=date], .field select, .field textarea{
  width:100%; padding:9px 11px; border:1px solid var(--line-strong); border-radius:var(--radius-s);
  background:var(--white); font-size:13.5px; font-family:inherit; color:var(--ink);
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--navy-3);}
.field textarea{resize:vertical; min-height:64px;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px;}
@media (max-width:760px){.row2,.row3{grid-template-columns:1fr;}}

.progress{height:7px; border-radius:5px; background:var(--paper-deep); overflow:hidden; border:1px solid var(--line);}
.progress > div{height:100%; background:var(--green);}
.progress.warn > div{background:var(--amber);}
.progress.bad > div{background:var(--red);}

.toast-wrap{position:fixed; right:24px; bottom:24px; z-index:200; display:flex; flex-direction:column; gap:10px;}
.toast{
  background:var(--navy); color:#fff; padding:12px 18px; border-radius:var(--radius-m);
  font-size:13px; box-shadow:var(--shadow-2); border-left:3px solid var(--gold-light);
  animation:toastin .25s ease;
}
@keyframes toastin{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

/* ---------- Wizard ---------- */
.steps-bar{display:flex; align-items:center; margin-bottom:24px;}
.step-node{display:flex; align-items:center; gap:9px; flex:1;}
.step-node .circle{
  width:28px; height:28px; border-radius:50%; border:1.5px solid var(--line-strong);
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600;
  color:var(--ink-soft); background:var(--white); flex-shrink:0; font-family:var(--font-serif);
}
.step-node.active .circle{border-color:var(--navy); background:var(--navy); color:#fff;}
.step-node.done .circle{border-color:var(--green); background:var(--green); color:#fff;}
.step-node .label{font-size:12px; color:var(--ink-soft);}
.step-node.active .label{color:var(--navy); font-weight:600;}
.step-connector{flex:1; height:1px; background:var(--line-strong); margin:0 6px;}

.wizard-actions{display:flex; justify-content:space-between; margin-top:24px; padding-top:18px; border-top:1px solid var(--line);}

.offer-row{display:grid; grid-template-columns:2fr 1.3fr 1fr auto; gap:10px; align-items:end; margin-bottom:10px;}
@media (max-width:760px){.offer-row{grid-template-columns:1fr;}}

.checklist-item{
  display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line);
}
.checklist-item:last-child{border-bottom:none;}
.checklist-item .dot{width:9px; height:9px; border-radius:50%; margin-top:5px; flex-shrink:0;}
.checklist-item.bloqueante .dot{background:var(--red);}
.checklist-item.aviso .dot{background:var(--amber);}
.checklist-item.info .dot{background:#2A4E7C;}
.checklist-item .txt{font-size:13px;}
.checklist-item .txt small{display:block; color:var(--ink-soft); font-size:11px; margin-top:2px; text-transform:uppercase; letter-spacing:.04em;}

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(19,26,42,0.55); z-index:100;
  display:flex; align-items:flex-start; justify-content:center; padding:34px 20px; overflow-y:auto;
}
.modal-box{
  background:var(--paper); border-radius:var(--radius-m); width:100%; max-width:940px;
  box-shadow:var(--shadow-2); border:1px solid var(--line-strong);
}
.modal-head{
  display:flex; align-items:flex-start; justify-content:space-between; padding:20px 24px;
  border-bottom:1px solid var(--line); background:var(--white); border-radius:5px 5px 0 0;
}
.modal-head h2{font-size:19px;}
.modal-head .meta{font-size:12px; color:var(--ink-soft); margin-top:4px;}
.modal-close{background:none; border:none; font-size:20px; color:var(--ink-soft); cursor:pointer; line-height:1; padding:4px 8px;}
.modal-close:hover{color:var(--ink);}
.tabs{display:flex; gap:2px; padding:0 24px; background:var(--white); border-bottom:1px solid var(--line);}
.tab-btn{
  padding:11px 15px; font-size:12.5px; font-weight:600; color:var(--ink-soft); background:none; border:none;
  border-bottom:2px solid transparent; cursor:pointer; margin-bottom:-1px;
}
.tab-btn:hover{color:var(--navy);}
.tab-btn.active{color:var(--navy); border-bottom-color:var(--gold);}
.modal-body{padding:22px 24px; max-height:66vh; overflow-y:auto;}
.modal-foot{display:flex; justify-content:space-between; align-items:center; padding:16px 24px; border-top:1px solid var(--line); background:var(--white); border-radius:0 0 5px 5px;}

/* ---------- Printable document sheet ---------- */
.doc-sheet{
  background:var(--white); border:1px solid var(--line-strong); padding:34px 38px;
  font-family:var(--font-serif); font-size:13px; color:#1c1a14; line-height:1.65; max-width:720px; margin:0 auto;
}
.doc-sheet h4{font-size:15px; text-align:center; margin-bottom:4px; letter-spacing:.01em;}
.doc-sheet .doc-entidad{text-align:center; font-size:11.5px; font-family:var(--font-sans); color:#555; margin-bottom:18px;}
.doc-sheet .doc-meta{display:flex; justify-content:space-between; font-family:var(--font-sans); font-size:11px; color:#555; margin-bottom:16px; border-bottom:1px solid #ddd; padding-bottom:10px;}
.doc-sheet p{margin:0 0 11px;}
.doc-sheet table{margin:14px 0; font-size:12.5px; font-family:var(--font-sans);}
.doc-sheet th{font-family:var(--font-sans);}
.doc-sheet .doc-sign{margin-top:38px; display:flex; justify-content:space-between; font-family:var(--font-sans); font-size:11.5px;}
.doc-sheet .doc-sign div{width:44%; border-top:1px solid #999; padding-top:6px; text-align:center; color:#555;}

.empty-state{padding:38px 20px; text-align:center; color:var(--ink-soft);}
.empty-state .big{font-family:var(--font-serif); font-size:16px; color:var(--navy); margin-bottom:6px;}

.mini-list{list-style:none; margin:0; padding:0;}
.mini-list li{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:12.5px;}
.mini-list li:last-child{border-bottom:none;}

.search-input{
  padding:9px 13px; border:1px solid var(--line-strong); border-radius:20px; font-size:13px;
  width:230px; background:var(--white); font-family:inherit;
}
.filters-bar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px;}
.filters-bar select{padding:8px 11px; border:1px solid var(--line-strong); border-radius:var(--radius-s); font-size:12.5px; background:var(--white); font-family:inherit;}

@media print{
  .sidebar, .topbar, .modal-overlay .modal-head, .modal-overlay .tabs, .modal-overlay .modal-foot, .no-print{display:none !important;}
  .modal-overlay{position:static; background:none; padding:0; display:block;}
  .modal-box{box-shadow:none; border:none; max-width:100%;}
  .modal-body{max-height:none; overflow:visible; padding:0;}
  body{background:#fff;}
}
/* ---------- Añadidos: idioma, tramitación, publicación trimestral ---------- */
.lang-switch{display:flex; border:1px solid var(--line-strong); border-radius:20px; overflow:hidden;}
.lang-switch button{
  padding:6px 12px; border:none; background:var(--white); color:var(--ink-soft); font-size:11.5px; font-weight:600; cursor:pointer;
}
.lang-switch button.active{background:var(--navy); color:#fff;}

.ficha-page{max-width:1100px;}
.ficha-header{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:16px;}
.ficha-header h2{font-size:22px;}
.ficha-header .meta{font-size:12.5px; color:var(--ink-soft); margin-top:4px;}
.ficha-tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:18px; flex-wrap:wrap;}
.ficha-tabs .tab-btn{padding:10px 14px;}

.tramite-stepper{display:flex; align-items:center; margin:8px 0 22px; flex-wrap:wrap; gap:0;}
.tramite-node{display:flex; flex-direction:column; align-items:center; gap:6px; flex:1; min-width:74px;}
.tramite-node .circle{
  width:26px; height:26px; border-radius:50%; border:1.5px solid var(--line-strong); background:var(--white);
  display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-soft); font-family:var(--font-serif); font-weight:600;
}
.tramite-node.done .circle{background:var(--green); border-color:var(--green); color:#fff;}
.tramite-node.current .circle{background:var(--navy); border-color:var(--navy); color:#fff;}
.tramite-node .lbl{font-size:10.5px; color:var(--ink-soft); text-align:center;}
.tramite-node.current .lbl{color:var(--navy); font-weight:600;}
.tramite-connector{flex:0.6; height:1px; background:var(--line-strong); margin-top:-20px;}

.inline-form{background:var(--paper); border:1px dashed var(--line-strong); border-radius:var(--radius-m); padding:16px; margin-top:14px;}
.inline-form h4{font-family:var(--font-sans); font-size:12.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--navy); margin-bottom:12px;}

.badge-excluido{background:#E7E2D4; color:#6B6250; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600;}

.trimestral-controls{display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap;}
.trimestral-controls select{padding:8px 12px; border:1px solid var(--line-strong); border-radius:var(--radius-s); font-size:13px; background:var(--white);}

.field-hint-block{background:var(--paper-deep); border-left:3px solid var(--gold); padding:10px 12px; font-size:12px; color:var(--ink-soft); border-radius:0 4px 4px 0; margin-bottom:14px;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

   INTERNACIONALIZACIÓN (ES / CA)

})();

  LANG = l;
  try{ localStorage.setItem('contratomenor_lang', l); }catch(e){}
}

function localeIntl(){ return LANG==='ca' ? 'ca-ES' : 'es-ES'; }

const I18N = {

  nav_publicaciones:'Perfil del contratante', nav_trimestral:'Publicación trimestral',

  nav_group_tramitacion:'Tramitación', sidebar_footer_role:'Secretaría / Intervención', sidebar_footer_ejercicio:'Ejercicio',

  title_expedientes:'Expedientes', sub_expedientes:'Listado completo de contratos menores tramitados',
  title_publicaciones:'Perfil del contratante', sub_publicaciones:'Publicaciones y anotaciones registrales pendientes',
  title_trimestral:'Publicación trimestral', sub_trimestral:'Salida agregada para el Perfil del Contratante, ordenada por adjudicatario',

  title_configuracion:'Configuración', sub_configuracion:'Datos de la entidad y parámetros normativos',
  title_ficha:'Ficha de expediente', sub_ficha:'Vista completa para tramitar el expediente',

  kpi_expedientes_totales:'Expedientes totales', kpi_importe_total:'Importe total tramitado', kpi_pendientes_publicar:'Pendientes de publicar',
  kpi_alertas_bloqueantes:'Alertas bloqueantes', kpi_ejercicio:'Ejercicio', kpi_iva_incluido:'IVA incluido, todos los expedientes',
  kpi_perfil_contratante:'En el Perfil del Contratante', kpi_avisos_adicionales:'{n} avisos adicionales',

  panel_expedientes_recientes:'Expedientes recientes', hint_ultimos_movimientos:'Últimos movimientos del ejercicio',
  panel_cumplimiento_pendiente:'Cumplimiento pendiente', hint_publicacion_registro:'Publicación y registro',

function t(key, vars){
  let str = (I18N[LANG] && I18N[LANG][key]!==undefined) ? I18N[LANG][key] : (I18N.es[key]!==undefined ? I18N.es[key] : key);
  if(vars){
    Object.keys(vars).forEach(k => { str = str.split('{'+k+'}').join(vars[k]); });
  }
  return str;
}

/* =========================================================================
   UTILIDADES
   ========================================================================= */

function fmtEUR(n){
  if(n===null || n===undefined || isNaN(n)) return "—";
  return new Intl.NumberFormat(localeIntl(),{style:'currency',currency:'EUR',minimumFractionDigits:2}).format(n);
}
function fmtDate(d){
  if(!d) return "—";
  const dt = new Date(d + (String(d).length<=10?'T00:00:00':''));
  return dt.toLocaleDateString(localeIntl(),{day:'2-digit',month:'2-digit',year:'numeric'});
}
function fmtDateLong(d){
  const dt = new Date(d + (String(d).length<=10?'T00:00:00':''));
  return dt.toLocaleDateString(localeIntl(),{day:'numeric',month:'long',year:'numeric'});
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function uid(){ return 'e' + Math.random().toString(36).slice(2,9); }
function escapeHTML(s){
  return String(s===undefined||s===null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* =========================================================================
   REGLAS DE NEGOCIO Y CÁLCULOS NORMATIVOS
   ========================================================================= */

function limiteFor(tipo){
  if(tipo==='obra') return CONFIG.umbralObra;
  if(tipo==='servicio') return CONFIG.umbralServicio;
  return CONFIG.umbralSuministro;
}

function calcularFiscal(exp){
  const base = Number(exp.base) || 0;
  const ivaRate = (exp.ivaRate!==undefined && exp.ivaRate!==null) ? Number(exp.ivaRate) : CONFIG.ivaDefault;
  const iva = base * ivaRate / 100;
  const totalConIva = base + iva;
  const catId = exp.adjudicatario ? exp.adjudicatario.categoriaFiscal : null;
  const retRate = catId ? categoriaFiscalRetencion(catId) : 0;
  const retencion = base * retRate / 100;
  const neto = totalConIva - retencion;
  return { base, ivaRate, iva, totalConIva, retRate, retencion, neto };
}

/* Ventana de 12 meses hacia atrás desde la fecha de referencia de un expediente */
function enVentana12Meses(fechaRef, fechaOtro){
  const fin = new Date(fechaRef);
  const inicioVentana = new Date(fin);
  inicioVentana.setMonth(inicioVentana.getMonth() - 12);
  const o = new Date(fechaOtro);
  return o <= fin && o > inicioVentana;
}

/* Fraccionamiento por familia homogénea + tipo (como en la versión anterior) */
function acumuladoPorFamilia(exp, all){
  const limite = limiteFor(exp.tipo);
  const relacionados = all.filter(o =>
    o.familia === exp.familia && o.tipo === exp.tipo && enVentana12Meses(exp.fechaInicio, o.fechaInicio)
  );
  const total = relacionados.reduce((s,o)=> s + (Number(o.base)||0), 0);
  return { total, limite, ratio: limite>0 ? total/limite : 0, relacionados };
}

/* Fraccionamiento por proveedor (mismo NIF, mismo tipo, ventana 12 meses) */
function acumuladoPorProveedor(exp, all){
  if(!exp.adjudicatario) return null;
  const limite = limiteFor(exp.tipo);
  const relacionados = all.filter(o =>
    o.adjudicatario && o.adjudicatario.nif === exp.adjudicatario.nif && o.tipo === exp.tipo &&
    enVentana12Meses(exp.fechaInicio, o.fechaInicio)
  );
  const total = relacionados.reduce((s,o)=> s + (Number(o.base)||0), 0);
  return { total, limite, ratio: limite>0 ? total/limite : 0, relacionados };
}

/* Fraccionamiento por centro gestor (mismo departamento + familia + tipo, ventana 12 meses) */
function acumuladoPorCentroGestor(exp, all){
  const limite = limiteFor(exp.tipo);
  const relacionados = all.filter(o =>
    o.departamento === exp.departamento && o.familia === exp.familia && o.tipo === exp.tipo &&
    enVentana12Meses(exp.fechaInicio, o.fechaInicio)
  );
  const total = relacionados.reduce((s,o)=> s + (Number(o.base)||0), 0);
  return { total, limite, ratio: limite>0 ? total/limite : 0, relacionados };
}

const OBJETOS_GENERICOS = ['varios','diversos','generales','material diverso','trabajos varios','servicios varios','servicios generales','suministros varios','obras varias','gastos diversos'];

function esObjetoGenerico(texto){
  if(!texto) return true;
  const t = texto.trim().toLowerCase();
  if(t.length < 18) return true;
  return OBJETOS_GENERICOS.some(g => t.includes(g));
}

/* Exclusión de publicidad obligatoria por sistema de pago (caja fija) y cuantía reducida.
   NOTA: regla simplificada y configurable; no constituye asesoramiento jurídico vinculante,
   revísese conforme a la normativa y bases de ejecución presupuestaria aplicables. */
function esExcluidoPublicidad(exp){
  return exp.pagoSistema === 'caja_fija' && Number(exp.base) <= CONFIG.umbralExclusionCajaFija;
}

/* Comprobación de los campos exigidos por la LCSP para la publicidad trimestral */
function camposPublicidad(exp){
  const fisc = calcularFiscal(exp);
  return [
    { id:'objeto', label:t('publicidad_objeto'), ok: !!exp.objeto && exp.objeto.trim().length>0 },
    { id:'duracion', label:t('publicidad_duracion'), ok: !!exp.duracionMeses && exp.duracionMeses>0 },
    { id:'adjudicatario', label:t('publicidad_adjudicatario'), ok: !!exp.adjudicatario },
    { id:'importe', label:t('publicidad_importe'), ok: fisc.totalConIva>0 },
    { id:'fecha_adjudicacion', label:t('publicidad_fecha_adj'), ok: !!exp.fechaAdjudicacion }
  ];
}
function publicidadCompleta(exp){
  return camposPublicidad(exp).every(c=>c.ok);
}

/* Devuelve el listado de incidencias de cumplimiento de un expediente,
   incluyendo fraccionamiento por familia, proveedor y centro gestor. */
function evaluarCumplimiento(exp, all){
  const issues = [];
  const limite = limiteFor(exp.tipo);

  if(!exp.adjudicatario){
    issues.push({ nivel:'bloqueante', categoria:t('categoria_adjudicatario'), mensaje: t('msg_bloq_adjudicatario') });
  }

  if(Number(exp.base) > limite){
    issues.push({ nivel:'bloqueante', categoria:t('categoria_umbral'), mensaje:
      t('msg_bloq_umbral', { base: fmtEUR(exp.base), tipo: etiquetaTipo(exp.tipo).toLowerCase(), limite: fmtEUR(limite) }) });
  }

  const fracFam = acumuladoPorFamilia(exp, all);
  if(fracFam.ratio >= 1){
    issues.push({ nivel:'bloqueante', categoria:t('categoria_frac_familia'), mensaje:
      t('msg_bloq_frac_familia', { familia: familiaLabel(exp.familia), total: fmtEUR(fracFam.total), limite: fmtEUR(fracFam.limite) }) });
  } else if(fracFam.ratio >= 0.85){
    issues.push({ nivel:'aviso', categoria:t('categoria_frac_familia'), mensaje:
      t('msg_aviso_frac_familia', { familia: familiaLabel(exp.familia), total: fmtEUR(fracFam.total), pct: Math.round(fracFam.ratio*100) }) });
  }

  const fracProv = acumuladoPorProveedor(exp, all);
  if(fracProv){
    if(fracProv.ratio >= 1){
      issues.push({ nivel:'bloqueante', categoria:t('categoria_frac_proveedor'), mensaje:
        t('msg_bloq_frac_proveedor', { nif: exp.adjudicatario.nif, total: fmtEUR(fracProv.total), limite: fmtEUR(fracProv.limite) }) });
    } else if(fracProv.ratio >= 0.85){
      issues.push({ nivel:'aviso', categoria:t('categoria_frac_proveedor'), mensaje:
        t('msg_aviso_frac_proveedor', { nif: exp.adjudicatario.nif, total: fmtEUR(fracProv.total), pct: Math.round(fracProv.ratio*100) }) });
    }
  }

  const fracCentro = acumuladoPorCentroGestor(exp, all);
  if(fracCentro.ratio >= 1){
    issues.push({ nivel:'bloqueante', categoria:t('categoria_frac_centro'), mensaje:
      t('msg_bloq_frac_centro', { depto: departamentoLabel(exp.departamento), familia: familiaLabel(exp.familia), total: fmtEUR(fracCentro.total), limite: fmtEUR(fracCentro.limite) }) });
  } else if(fracCentro.ratio >= 0.85 && fracCentro.ratio < fracFam.ratio - 0.001){
    // Solo se añade si aporta información distinta del acumulado por familia (evita duplicar el mismo aviso)
    issues.push({ nivel:'aviso', categoria:t('categoria_frac_centro'), mensaje:
      t('msg_aviso_frac_centro', { depto: departamentoLabel(exp.departamento), familia: familiaLabel(exp.familia), total: fmtEUR(fracCentro.total), pct: Math.round(fracCentro.ratio*100) }) });
  }

  if(esObjetoGenerico(exp.objeto)){
    issues.push({ nivel:'aviso', categoria:t('categoria_objeto'), mensaje: t('msg_aviso_objeto') });
  }

  const esEnergetico = exp.familia === 'electrico';
  if(exp.duracionMeses > CONFIG.duracionMaxMeses && !(esEnergetico && exp.duracionMeses <= 60)){
    issues.push({ nivel:'aviso', categoria:t('categoria_duracion'), mensaje:
      t('msg_aviso_duracion', { meses: exp.duracionMeses, max: CONFIG.duracionMaxMeses }) });
  }

  const numOfertas = exp.ofertas ? exp.ofertas.length : 0;
  if(numOfertas === 0){
    issues.push({ nivel:'bloqueante', categoria:t('categoria_concurrencia'), mensaje: t('msg_bloq_sin_ofertas') });
  } else if(numOfertas < 3){
    issues.push({ nivel:'aviso', categoria:t('categoria_concurrencia'), mensaje: t('msg_aviso_pocas_ofertas', { n: numOfertas }) });
  }

  if(Number(exp.base) > CONFIG.umbralRegistro){
    issues.push({ nivel:'info', categoria:t('categoria_registro'), mensaje: t('msg_info_registro', { umbral: fmtEUR(CONFIG.umbralRegistro) }), registroRequerido:true });
  }

  return issues;
}

function tieneBloqueantes(exp, all){
  return evaluarCumplimiento(exp, all).some(i => i.nivel === 'bloqueante');
}

/* Modelo 347: obligación informativa cuando el acumulado anual por NIF supera el umbral */
function resumen347(all){
  const year = new Date().getFullYear();
  const porNif = {};
  all.forEach(exp => {
    if(!exp.adjudicatario) return;
    const nif = exp.adjudicatario.nif;
    if(new Date(exp.fechaInicio).getFullYear() !== year) return;
    if(!porNif[nif]) porNif[nif] = { nif, empresa: exp.adjudicatario.empresa, total:0, expedientes:[] };
    porNif[nif].total += calcularFiscal(exp).totalConIva;
    porNif[nif].expedientes.push(exp);
  });
  return Object.values(porNif).map(r => ({...r, obligacion: r.total > CONFIG.umbral347}))
    .sort((a,b)=> b.total-a.total);
}

function generarPropuestaAdjudicacion(exp){

function generarFormalizacion(exp){
  const fisc = calcularFiscal(exp);

  const titulo = esFacturaSimplificada ? t('doc_formalizacion_titulo_factura') : t('doc_formalizacion_titulo_contrato');

  const retencionTxt = fisc.retencion>0 ? t('doc_formalizacion_retencion', { retencion: fmtEUR(fisc.retencion), neto: fmtEUR(fisc.neto) }) : '';
  return `
    ${docCabecera(titulo, exp)}
    <p>${escapeHTML(t('doc_formalizacion_intro', { entidad: CONFIG.entidad, adjudicatario: adjTxt, nif: nifTxt }))}</p>
    <p>${escapeHTML(t('doc_formalizacion_objeto', { objeto: exp.objeto }))}</p>
    <p>${escapeHTML(t('doc_formalizacion_precio', { base: fmtEUR(fisc.base), pctIva: fisc.ivaRate, iva: fmtEUR(fisc.iva), total: fmtEUR(fisc.totalConIva), retencionTxt }))}</p>
    <p>${escapeHTML(t('doc_formalizacion_plazo', { meses: exp.duracionMeses, fecha: fmtDate(exp.fechaInicio) }))}</p>
    <p>${escapeHTML(t('doc_formalizacion_cierre'))}</p>
    ${docFirma(t('doc_firma_ayuntamiento'), t('doc_firma_adjudicatario'))}

function generarChecklist(exp, all){
  const issues = evaluarCumplimiento(exp, all);
  const filas = issues.map(i => `<tr><td>${escapeHTML(i.categoria)}</td><td>${escapeHTML(i.nivel.toUpperCase())}</td><td>${escapeHTML(i.mensaje)}</td></tr>`).join('');
  const bloqueantes = issues.filter(i=>i.nivel==='bloqueante').length;
  const resultado = bloqueantes>0
    ? t('doc_checklist_resultado_con', { numero: exp.numero, n: bloqueantes })
    : t('doc_checklist_resultado_sin', { numero: exp.numero });
  const pubEstado = exp.publicacion ? t('doc_checklist_realizada') : t('doc_checklist_pendiente');
  const regEstado = exp.estado==='pagado' || exp.estado==='archivado' || exp.factura ? t('doc_checklist_realizada')
    : (Number(exp.base) > CONFIG.umbralRegistro ? t('doc_checklist_pendiente') : t('doc_checklist_no_exigible'));
  return `
    ${docCabecera(t('doc_checklist_titulo'), exp)}
    <p>${escapeHTML(resultado)}</p>
    <table>
      <tr><th>${t('th_categoria')}</th><th>${t('th_nivel')}</th><th>${t('th_observacion')}</th></tr>
      ${filas || `<tr><td colspan="3">${escapeHTML(t('doc_checklist_sin_filas'))}</td></tr>`}

    <p><strong>${escapeHTML(t('doc_checklist_registro', { estado: regEstado }))}</strong></p>

}

function documentosCatalogo(){
  return [

/* =========================================================================
   PERSISTENCIA (localStorage)
   ========================================================================= */

const STORAGE_KEY = 'contratomenor_app_v2';

function storageDisponible(){
  try{ const k='__t__'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }catch(e){ return false; }
}
function guardarEstado(){
  if(!storageDisponible()) return false;
  try{
    const payload = { version:2, guardadoEn:new Date().toISOString(), config:CONFIG, expedientes:App.state.expedientes };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    return true;
  }catch(e){ console.warn('No se pudo guardar el estado:', e); return false; }
}
function cargarEstado(){
  if(!storageDisponible()) return null;
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    const data = JSON.parse(raw);
    if(data && data.config) Object.assign(CONFIG, data.config);
    return (data && Array.isArray(data.expedientes)) ? data.expedientes : null;
  }catch(e){ console.warn('No se pudo leer el estado guardado:', e); return null; }
}
function borrarEstadoGuardado(){ if(storageDisponible()) localStorage.removeItem(STORAGE_KEY); }

/* =========================================================================
   ESTADO DE LA APLICACIÓN
   ========================================================================= */

const App = {
  state: {
    view: 'dashboard',
    expedientes: cargarEstado() || JSON.parse(JSON.stringify(EXPEDIENTES_INICIALES)),
    filtros: { texto:'', tipo:'', estado:'', familia:'' },
    fichaId: null,
    fichaTab: 'resumen',
    fichaDocTab: 'memoria',
    fichaAccionPendiente: null, // 'publicar' | 'facturar' | 'pagar'
    wizard: null,
    trimestral: { anio: new Date().getFullYear(), trimestre: trimestreDeFecha(todayISO()) }
  },

  init(){
    if(storageDisponible() && !localStorage.getItem(STORAGE_KEY)) guardarEstado();
    this.render();
  },

  setLang(l){
    setLang(l);
    this.render();
  },

  goTo(view){
    this.state.view = view;
    this.render();
  },

  toast(msg){
    const wrap = document.getElementById('toastWrap');
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    wrap.appendChild(el);
    setTimeout(()=>{ el.style.transition='opacity .3s ease'; el.style.opacity='0'; setTimeout(()=>el.remove(),320); }, 2800);
  },

  render(){
    const root = document.getElementById('app');
    root.innerHTML = renderSidebar(this.state) + renderMain(this.state);
    window.scrollTo(0,0);
  },

  /* ---- navegación de fichas ---- */
  openExpediente(id){
    this.state.fichaId = id;
    this.state.fichaTab = 'resumen';
    this.state.fichaDocTab = 'memoria';
    this.state.fichaAccionPendiente = null;
    this.goTo('ficha');
  },
  setFichaTab(tab){
    this.state.fichaTab = tab;
    this.state.fichaAccionPendiente = null;
    this.render();
  },
  setDocTab(docId){
    this.state.fichaDocTab = docId;
    this.render();
  },

  /* ---- motor de estados de tramitación ---- */
  avanzarEstado(id){
    const exp = this.state.expedientes.find(e=>e.id===id);
    if(!exp) return;
    const next = siguienteEstado(exp.estado);
    if(!next){ this.toast(t('estado_terminal')); return; }

    // Puerta de validación: no se puede pasar de borrador a validado/aprobado con bloqueantes
    if(exp.estado==='borrador' || exp.estado==='validado'){
      const bloqueantes = evaluarCumplimiento(exp, this.state.expedientes).filter(i=>i.nivel==='bloqueante').length;
      if(bloqueantes>0){
        this.toast(t('toast_avance_bloqueado', { n: bloqueantes }));
        return;
      }
    }

    // Transiciones que exigen registrar evidencia mediante formulario
    if(next==='publicado'){ this.state.fichaAccionPendiente = 'publicar'; this.render(); return; }
    if(next==='facturado'){ this.state.fichaAccionPendiente = 'facturar'; this.render(); return; }
    if(next==='pagado'){ this.state.fichaAccionPendiente = 'pagar'; this.render(); return; }

    exp.estado = next;
    guardarEstado();
    this.toast(t('toast_avance_ok', { n: exp.numero, estado: etiquetaEstado(next) }));
    this.render();
  },
  retrocederEstado(id){
    const exp = this.state.expedientes.find(e=>e.id===id);
    if(!exp) return;
    const prev = anteriorEstado(exp.estado);
    if(!prev) return;
    exp.estado = prev;
    guardarEstado();
    this.toast(t('toast_retroceso_ok', { n: exp.numero, estado: etiquetaEstado(prev) }));
    this.render();
  },
  cancelarAccionPendiente(){
    this.state.fichaAccionPendiente = null;
    this.render();
  },
  confirmarPublicacion(id){
    const exp = this.state.expedientes.find(e=>e.id===id);
    if(!exp) return;
    const fecha = document.getElementById('pubFecha').value;
    const usuario = document.getElementById('pubUsuario').value.trim();
    const url = document.getElementById('pubUrl').value.trim();
    const trimestre = Number(document.getElementById('pubTrimestre').value);
    if(!fecha || !usuario){ this.toast(t('toast_completa_form')); return; }
    exp.publicacion = { fecha, usuario, url, trimestre };
    exp.estado = 'publicado';
    this.state.fichaAccionPendiente = null;
    guardarEstado();
    this.toast(t('toast_publicacion_confirmada', { n: exp.numero }));
    this.render();
  },
  confirmarFactura(id){
    const exp = this.state.expedientes.find(e=>e.id===id);
    if(!exp) return;
    const numero = document.getElementById('facNumero').value.trim();
    const fecha = document.getElementById('facFecha').value;
    if(!numero || !fecha){ this.toast(t('toast_completa_form')); return; }
    exp.factura = { numero, fecha };
    exp.estado = 'facturado';
    this.state.fichaAccionPendiente = null;
    guardarEstado();
    this.toast(t('toast_factura_confirmada', { n: exp.numero }));
    this.render();
  },
  confirmarPago(id){
    const exp = this.state.expedientes.find(e=>e.id===id);
    if(!exp) return;
    const fecha = document.getElementById('pagoFecha').value;
    const referencia = document.getElementById('pagoRef').value.trim();
    if(!fecha || !referencia){ this.toast(t('toast_completa_form')); return; }
    exp.pago = { fecha, referencia };
    exp.estado = 'pagado';
    this.state.fichaAccionPendiente = null;
    guardarEstado();
    this.toast(t('toast_pago_confirmado', { n: exp.numero }));
    this.render();
  },
  guardarJustificacionFraccionamiento(id){
    const exp = this.state.expedientes.find(e=>e.id===id);
    if(!exp) return;
    exp.justificacionFraccionamiento = document.getElementById('justificacionFrac').value;
    guardarEstado();
    this.toast(t('toast_frac_guardada'));
  },

  eliminarExpediente(id){
    const exp = this.state.expedientes.find(e=>e.id===id);
    if(!exp) return;
    if(!confirm(t('confirm_eliminar', { n: exp.numero }))) return;
    this.state.expedientes = this.state.expedientes.filter(e=>e.id!==id);
    guardarEstado();
    this.toast(t('toast_eliminado', { n: exp.numero }));
    this.goTo('expedientes');
  },

  /* ---- filtros del listado ---- */
  setFiltro(campo, valor){
    this.state.filtros[campo] = valor;
    const cont = document.getElementById('expedientesTableWrap');
    if(cont) cont.innerHTML = renderExpedientesTabla(this.state);
  },

  /* ---- configuración ---- */
  guardarConfigCampo(campo, valor){
    if(['umbralObra','umbralServicio','umbralSuministro','duracionMaxMeses','ivaDefault','umbralRegistro','umbralExclusionCajaFija'].includes(campo)){
      CONFIG[campo] = Number(valor);
    } else {
      CONFIG[campo] = valor;
    }
    guardarEstado();
    this.toast(t('toast_config_guardada'));

  restablecerDatosEjemplo(){
    if(!confirm(t('confirm_restablecer'))) return;
    borrarEstadoGuardado();

    this.state.expedientes = JSON.parse(JSON.stringify(EXPEDIENTES_INICIALES));
    guardarEstado();
    this.toast(t('toast_datos_restablecidos'));
    this.goTo('dashboard');
  },
  exportarCopiaSeguridad(){
    const payload = { version:2, exportadoEn:new Date().toISOString(), config:CONFIG, expedientes:this.state.expedientes };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `contratomenor_copia_${todayISO()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    this.toast(t('toast_backup_exportada'));
  },
  importarCopiaSeguridad(fileInput){
    const file = fileInput.files && fileInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try{
        const data = JSON.parse(ev.target.result);
        if(!data || !Array.isArray(data.expedientes)) throw new Error('formato');
        if(data.config) Object.assign(CONFIG, data.config);
        this.state.expedientes = data.expedientes;
        guardarEstado();
        this.toast(t('toast_backup_importada'));
        this.goTo('dashboard');
      }catch(e){ this.toast(t('toast_backup_error')); }
    };
    reader.readAsText(file);
    fileInput.value = '';
  },

  /* ---- módulo de publicación trimestral ---- */
  setTrimestral(campo, valor){
    this.state.trimestral[campo] = Number(valor);
    this.render();
  },
  publicarPendientesTrimestre(){
    const { anio, trimestre } = this.state.trimestral;
    const lista = expedientesDelTrimestre(this.state.expedientes, anio, trimestre)
      .filter(e => !e.publicacion && !esExcluidoPublicidad(e));
    if(lista.length===0){ this.render(); return; }
    const fecha = todayISO();
    lista.forEach(exp => {
      exp.publicacion = { fecha, usuario: CONFIG.secretaria, url:'', trimestre };
      if(exp.estado==='aprobado') exp.estado = 'publicado';
    });
    guardarEstado();
    this.toast(t('toast_trimestral_publicados', { n: lista.length }));
    this.render();
  },
  generarSalidaTrimestral(){
    const { anio, trimestre } = this.state.trimestral;
    const lista = expedientesDelTrimestre(this.state.expedientes, anio, trimestre)
      .slice().sort((a,b)=> (a.adjudicatario?a.adjudicatario.empresa:'').localeCompare(b.adjudicatario?b.adjudicatario.empresa:''));
    const lineas = [
      `${CONFIG.entidad} — ${t('title_trimestral')} — ${anio} ${t('trimestral_trimestre')} ${trimestre}`,
      '='.repeat(70), ''
    ];
    lista.forEach(exp => {
      const fisc = calcularFiscal(exp);
      lineas.push(`${exp.adjudicatario ? exp.adjudicatario.empresa : '—'} (NIF ${exp.adjudicatario ? exp.adjudicatario.nif : '—'})`);
      lineas.push(`  ${t('th_expediente')}: ${exp.numero}`);
      lineas.push(`  ${t('publicidad_objeto')}: ${exp.objeto}`);
      lineas.push(`  ${t('publicidad_duracion')}: ${exp.duracionMeses} m.`);
      lineas.push(`  ${t('publicidad_importe')}: ${fisc.totalConIva.toFixed(2)} €`);
      lineas.push(`  ${t('publicidad_fecha_adj')}: ${exp.fechaAdjudicacion ? fmtDate(exp.fechaAdjudicacion) : '—'}`);
      lineas.push('');
    });
    const blob = new Blob([lineas.join('\n')], {type:'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `publicacion_trimestral_${anio}_T${trimestre}.txt`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);

  /* ---- wizard de nuevo expediente ---- */
  iniciarWizard(){
    this.state.wizard = {
      step: 1,
      data: {
        departamento: DEPARTAMENTOS[0].id, tipo:'servicio', familia: FAMILIAS[0].id,
        credito:'', objeto:'', necesidad:'', organoGestor:'Alcaldía-Presidencia', responsableTramitador:'',
        base:'', valorEstimado:'', ivaRate: CONFIG.ivaDefault, duracionMeses:3, fechaInicio: todayISO(),
        ofertas:[], adjudicatarioEmpresa:'', adjudicatarioNif:'', categoriaFiscal: FISCAL_CATEGORIES[0].id,
        fechaAdjudicacion:'', pagoSistema:'ordinario', docTab:'memoria'
      }
    };
    this.goTo('nuevo');
  },
  updateWizardField(campo, valor){
    if(!this.state.wizard) return;
    this.state.wizard.data[campo] = valor;
  },
  wizardNext(){
    const w = this.state.wizard;
    if(!w) return;
    if(w.step===1){
      if(!w.data.objeto || !w.data.credito || !w.data.base){
        this.toast(t('wizard_completa_campos'));
        return;
      }
    }
    w.step = Math.min(5, w.step+1);
    this.render();
  },
  wizardBack(){
    const w = this.state.wizard;
    if(!w) return;
    w.step = Math.max(1, w.step-1);
    this.render();
  },
  wizardGoStep(step){
    if(!this.state.wizard) return;
    this.state.wizard.step = step;
    this.render();
  },
  wizardAddOferta(){
    const w = this.state.wizard;
    const empresa = document.getElementById('ofEmpresa').value.trim();
    const nif = document.getElementById('ofNif').value.trim();
    const precio = parseFloat(document.getElementById('ofPrecio').value);
    if(!empresa || !nif || isNaN(precio)){ this.toast(t('wizard_completa_oferta')); return; }
    w.data.ofertas.push({ empresa, nif, precio });
    document.getElementById('ofertasTableWrap').innerHTML = renderOfertasTabla(w.data.ofertas);
    document.getElementById('ofEmpresa').value=''; document.getElementById('ofNif').value=''; document.getElementById('ofPrecio').value='';
  },
  wizardRemoveOferta(idx){
    const w = this.state.wizard;
    w.data.ofertas.splice(idx,1);
    document.getElementById('ofertasTableWrap').innerHTML = renderOfertasTabla(w.data.ofertas);
  },
  wizardFinish(){
    const w = this.state.wizard;
    if(!w) return;
    const d = w.data;
    const nuevo = {
      id: uid(), numero: proximoNumeroExpediente(this.state.expedientes),
      tipo:d.tipo, familia:d.familia, departamento:d.departamento, objeto:d.objeto, necesidad:d.necesidad,
      organoGestor:d.organoGestor, responsableTramitador:d.responsableTramitador,
      credito:d.credito, base:Number(d.base)||0, valorEstimado:Number(d.valorEstimado)||Number(d.base)||0,
      ivaRate:Number(d.ivaRate), duracionMeses:Number(d.duracionMeses)||1,
      fechaInicio:d.fechaInicio, fechaCreacion: todayISO(), fechaAdjudicacion: d.fechaAdjudicacion || null,
      estado:'borrador', pagoSistema:d.pagoSistema,
      ofertas:d.ofertas,
      adjudicatario: d.adjudicatarioEmpresa ? { empresa:d.adjudicatarioEmpresa, nif:d.adjudicatarioNif, categoriaFiscal:d.categoriaFiscal } : null,
      factura:null, pago:null, publicacion:null, justificacionFraccionamiento:'', observaciones:''
    };
    this.state.expedientes.unshift(nuevo);
    this.state.wizard = null;
    guardarEstado();
    this.toast(t('toast_expediente_creado', { n: nuevo.numero }));
    this.goTo('expedientes');
  }
};

function proximoNumeroExpediente(all){
  const year = new Date().getFullYear();
  const nums = all
    .map(e => e.numero.match(/CM-(\d{4})-(\d+)/))
    .filter(m => m && Number(m[1])===year)
    .map(m => Number(m[2]));
  const next = (nums.length ? Math.max(...nums) : 0) + 1;
  return `CM-${year}-${String(next).padStart(3,'0')}`;
}

function expedientesDelTrimestre(all, anio, trimestre){
  const q = TRIMESTRES.find(x=>x.id===trimestre);
  return all.filter(e => e.fechaAdjudicacion &&
    new Date(e.fechaAdjudicacion).getFullYear()===anio &&
    q.meses.includes(new Date(e.fechaAdjudicacion).getMonth()));
}

function renderDashboard(state){
  const all = state.expedientes;
  const totalImporte = all.reduce((s,e)=> s + calcularFiscal(e).totalConIva, 0);
  const alertas = all.reduce((s,e)=> s + evaluarCumplimiento(e, all).filter(i=>i.nivel==='bloqueante').length, 0);
  const avisos = all.reduce((s,e)=> s + evaluarCumplimiento(e, all).filter(i=>i.nivel==='aviso').length, 0);
  const pendPublicar = all.filter(e => !e.publicacion && !esExcluidoPublicidad(e) && e.estado!=='borrador');

  const recientes = all.slice().sort((a,b)=> new Date(b.fechaCreacion) - new Date(a.fechaCreacion)).slice(0,6);

  const filasRecientes = recientes.map(e => {
    const fisc = calcularFiscal(e);
    return `
    <tr onclick="App.openExpediente('${e.id}')" style="cursor:pointer;">
      <td><strong>${escapeHTML(e.numero)}</strong><div style="color:var(--ink-soft); font-size:11.5px;">${escapeHTML(familiaLabel(e.familia))}</div></td>
      <td>${escapeHTML(etiquetaTipo(e.tipo))}</td>
      <td>${escapeHTML(departamentoLabel(e.departamento))}</td>

      <td><span class="chip ${e.estado}">${etiquetaEstado(e.estado)}</span></td>
    </tr>`;
  }).join('');

  const familiasResumen = FAMILIAS.map(fam => {
    const deTipo = all.filter(e=>e.familia===fam.id);
    if(deTipo.length===0) return null;
    const ref = deTipo.slice().sort((a,b)=> new Date(b.fechaInicio)-new Date(a.fechaInicio))[0];
    const frac = acumuladoPorFamilia(ref, all);
    const pct = Math.min(100, Math.round(frac.ratio*100));
    const cls = frac.ratio>=1 ? 'bad' : (frac.ratio>=0.85 ? 'warn' : '');
    return `
      <div style="margin-bottom:14px;">
        <div style="display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:5px;">
          <span>${escapeHTML(familiaLabel(fam.id))}</span>
          <span class="num" style="color:var(--ink-soft);">${fmtEUR(frac.total)} / ${fmtEUR(frac.limite)}</span>
        </div>
        <div class="progress ${cls}"><div style="width:${pct}%;"></div></div>
      </div>`;
  }).filter(Boolean).join('');

  const cumplimientoPendiente = all.filter(e => {
    const req = Number(e.base) > CONFIG.umbralRegistro;
    return (!e.publicacion && e.estado!=='borrador' && !esExcluidoPublicidad(e));
  });
  const cumplimientoFilas = cumplimientoPendiente.length ? cumplimientoPendiente.map(e => `
    <li>
      <span>${escapeHTML(e.numero)} — ${escapeHTML(e.objeto.slice(0,42))}${e.objeto.length>42?'…':''}</span>
      <span><span class="chip aviso">${escapeHTML(t('kpi_pendientes_publicar'))}</span></span>
    </li>`).join('') : `<li><span style="color:var(--ink-soft);">${t('no_pendientes_publicacion')}</span></li>`;

  return `
    <div class="grid-kpi">
      <div class="kpi">
        <div class="label">${t('kpi_expedientes_totales')}</div>
        <div class="value">${all.length}</div>
        <div class="foot">${t('kpi_ejercicio')} ${new Date().getFullYear()}</div>
      </div>
      <div class="kpi ok">
        <div class="label">${t('kpi_importe_total')}</div>
        <div class="value" style="font-size:20px;">${fmtEUR(totalImporte)}</div>
        <div class="foot">${t('kpi_iva_incluido')}</div>
      </div>
      <div class="kpi">
        <div class="label">${t('kpi_pendientes_publicar')}</div>
        <div class="value">${pendPublicar.length}</div>
        <div class="foot">${t('kpi_perfil_contratante')}</div>
      </div>
      <div class="kpi ${alertas>0?'alert':'ok'}">
        <div class="label">${t('kpi_alertas_bloqueantes')}</div>
        <div class="value">${alertas}</div>
        <div class="foot">${t('kpi_avisos_adicionales',{n:avisos})}</div>
      </div>
    </div>

    <div class="row2" style="align-items:start; margin-bottom:20px;">
      <div class="panel">
        <div class="panel-head">
          <div><h3>${t('panel_expedientes_recientes')}</h3><div class="hint">${t('hint_ultimos_movimientos')}</div></div>
          <button class="btn secondary small" onclick="App.goTo('expedientes')">${t('ver_todos')}</button>
        </div>
        <div class="panel-body" style="padding:0;">
          <table>
            <thead><tr><th>${t('th_expediente')}</th><th>${t('th_tipo')}</th><th>${t('th_departamento')}</th><th class="tright">${t('th_importe')}</th><th>${t('th_estado')}</th></tr></thead>
            <tbody>${filasRecientes}</tbody>
          </table>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <div><h3>${t('panel_cumplimiento_pendiente')}</h3><div class="hint">${t('hint_publicacion_registro')}</div></div>
        </div>
        <div class="panel-body"><ul class="mini-list">${cumplimientoFilas}</ul></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div><h3>${t('panel_alertas_umbral')}</h3><div class="hint">${t('hint_alertas_umbral')}</div></div>
        <button class="btn secondary small" onclick="App.goTo('umbrales')">${t('ver_detalle')}</button>
      </div>

    </div>
  `;
}

function descargarDocumentoActivo(expId, docId){
  const exp = App.state.expedientes.find(e=>e.id===expId);
  const doc = documentosCatalogo().find(d=>d.id===docId);
  if(!exp || !doc) return;
  const el = document.getElementById('docSheetContent');
  const texto = el ? el.innerText : '';
  const blob = new Blob([texto], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${exp.numero}_${doc.id}.txt`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  App.toast(t('toast_doc_txt'));
}

function exportarPDFDesdeElemento(elId, filename, btnEl){
  const el = document.getElementById(elId);
  if(!el) return;
  if(typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined'){
    App.toast(t('toast_doc_pdf_offline'));
    return;
  }
  const textoOriginal = btnEl ? btnEl.textContent : '';
  if(btnEl){ btnEl.textContent = '…'; btnEl.disabled = true; }
  html2canvas(el, { scale:2, backgroundColor:'#ffffff', useCORS:true }).then(canvas => {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const margin = 12;
    const usableWidth = pageWidth - margin*2;
    const imgHeight = (canvas.height * usableWidth) / canvas.width;
    const imgData = canvas.toDataURL('image/png');
    let heightLeft = imgHeight, position = margin;
    pdf.addImage(imgData, 'PNG', margin, position, usableWidth, imgHeight);
    heightLeft -= (pageHeight - margin*2);
    while(heightLeft > 0){
      pdf.addPage();
      position = margin - (imgHeight - heightLeft);
      pdf.addImage(imgData, 'PNG', margin, position, usableWidth, imgHeight);
      heightLeft -= (pageHeight - margin*2);
    }
    pdf.save(filename);
    App.toast(t('toast_doc_pdf'));
  }).catch(err => { console.error(err); App.toast(t('toast_doc_pdf_error')); })
    .finally(() => { if(btnEl){ btnEl.textContent = textoOriginal; btnEl.disabled = false; } });
}

function exportarDocumentoPDF(expId, docId, btnEl){
  const exp = App.state.expedientes.find(e=>e.id===expId);
  const doc = documentosCatalogo().find(d=>d.id===docId);
  if(!exp || !doc) return;
  exportarPDFDesdeElemento('docSheetContent', `${exp.numero}_${doc.id}.pdf`, btnEl);
}

          <div class="txt"><small>${escapeHTML(i.categoria)} · ${i.nivel}</small>${escapeHTML(i.mensaje)}</div>
        </div>`).join('');
  }

  else if(w.step===5){
    const expTemp = wizardDataToExpediente(d, state.expedientes);
    if(!w.data.docTab) w.data.docTab = 'memoria';
    const DOCUMENTOS = documentosCatalogo();
    const activo = DOCUMENTOS.find(x=>x.id===w.data.docTab) || DOCUMENTOS[0];
    stepBody = `
      <p style="color:var(--ink-soft); font-size:13px; margin-top:0;">${t('lbl_revisa_docs')}</p>
      <div style="margin-bottom:14px;">
        ${DOCUMENTOS.map(dc => `<button class="btn ${activo.id===dc.id?'':'secondary'} small" style="margin:0 6px 8px 0;" onclick="App.state.wizard.data.docTab='${dc.id}'; App.render();">${escapeHTML(dc.label)}</button>`).join('')}
        <button class="btn gold small" style="margin-left:6px;" onclick="exportarPDFDesdeElemento('docSheetContentWizard','borrador_${activo.id}.pdf', this)">${t('doc_exportar_pdf')}</button>
      </div>
      <div class="doc-sheet" id="docSheetContentWizard">${activo.gen(expTemp)}</div>
    `;
  }

  const esUltimo = w.step === wizardStepsLabels().length;

  return `
    <div class="panel">
      <div class="panel-body">
        ${renderStepsBar(w.step)}
        ${stepBody}
        <div class="wizard-actions">
          <button class="btn secondary" onclick="${w.step===1?"App.goTo('dashboard')":"App.wizardBack()"}">${w.step===1?t('wizard_cancelar'):t('wizard_atras')}</button>
          ${esUltimo
            ? `<button class="btn gold" onclick="App.wizardFinish()">${t('wizard_guardar')}</button>`
            : `<button class="btn" onclick="App.wizardNext()">${t('wizard_continuar')}</button>`}
        </div>
      </div>
    </div>`;
}

function wizardDataToExpediente(d, existentes){
  return {
    id:'temp', numero: proximoNumeroExpediente(existentes),
    tipo:d.tipo, familia:d.familia, departamento:d.departamento, objeto:d.objeto, necesidad:d.necesidad,
    organoGestor:d.organoGestor, responsableTramitador:d.responsableTramitador,
    credito:d.credito, base:Number(d.base)||0, valorEstimado:Number(d.valorEstimado)||Number(d.base)||0,
    ivaRate:Number(d.ivaRate), duracionMeses:Number(d.duracionMeses)||1, fechaInicio:d.fechaInicio,
    fechaCreacion:todayISO(), fechaAdjudicacion:d.fechaAdjudicacion||null, estado:'borrador', pagoSistema:d.pagoSistema,
    ofertas:d.ofertas,
    adjudicatario: d.adjudicatarioEmpresa ? { empresa:d.adjudicatarioEmpresa, nif:d.adjudicatarioNif, categoriaFiscal:d.categoriaFiscal } : null,
    factura:null, pago:null, publicacion:null, justificacionFraccionamiento:'', observaciones:''
  };
}

/* =========================================================================
   RENDER — PERFIL DEL CONTRATANTE
   ========================================================================= */

function renderPublicaciones(state){
  const all = state.expedientes;
  const pendPublicar = all.filter(e => e.estado!=='borrador' && !e.publicacion && !esExcluidoPublicidad(e));
  const excluidos = all.filter(e => esExcluidoPublicidad(e) && !e.publicacion);
  const publicados = all.filter(e => e.publicacion);

  const filaPend = list => list.length ? list.map(e => `
    <tr>
      <td><strong>${escapeHTML(e.numero)}</strong></td>
      <td>${escapeHTML(e.objeto.slice(0,60))}${e.objeto.length>60?'…':''}</td>
      <td class="num">${fmtEUR(calcularFiscal(e).totalConIva)}</td>
      <td><span class="chip ${e.estado}">${etiquetaEstado(e.estado)}</span></td>
      <td class="no-print"><button class="btn gold small" onclick="App.openExpediente('${e.id}')">${t('abrir')}</button></td>
    </tr>`).join('') : `<tr><td colspan="5" style="color:var(--ink-soft);">${t('sin_pendientes')}</td></tr>`;

  const filasPublicados = publicados.length ? publicados.map(e => `
    <tr><td>${escapeHTML(e.numero)}</td><td>${escapeHTML(e.objeto.slice(0,60))}${e.objeto.length>60?'…':''}</td>
      <td>${fmtDate(e.publicacion.fecha)}</td><td>${escapeHTML(e.publicacion.usuario)}</td></tr>
  `).join('') : `<tr><td colspan="4" style="color:var(--ink-soft);">${t('sin_pendientes')}</td></tr>`;

  const filasExcluidos = excluidos.length ? excluidos.map(e => `
    <tr><td>${escapeHTML(e.numero)}</td><td>${escapeHTML(e.objeto.slice(0,60))}${e.objeto.length>60?'…':''}</td>
      <td class="num">${fmtEUR(calcularFiscal(e).totalConIva)}</td><td><span class="badge-excluido">${t('publicidad_excluido_si')}</span></td></tr>
  `).join('') : `<tr><td colspan="4" style="color:var(--ink-soft);">${t('sin_pendientes')}</td></tr>`;

  return `
    <div class="panel" style="margin-bottom:20px;">
      <div class="panel-head"><div><h3>${t('title_publicaciones')}</h3><div class="hint">${t('hint_publicacion_registro')}</div></div></div>
      <div class="panel-body" style="padding:0;">
        <table><thead><tr><th>${t('th_expediente')}</th><th>${t('th_observacion')}</th><th class="tright">${t('th_importe')}</th><th>${t('th_estado')}</th><th></th></tr></thead>
        <tbody>${filaPend(pendPublicar)}</tbody></table>
      </div>
    </div>
    <div class="panel" style="margin-bottom:20px;">
      <div class="panel-head"><div><h3>${t('trimestral_excluidos')}</h3></div></div>
      <div class="panel-body" style="padding:0;">
        <table><thead><tr><th>${t('th_expediente')}</th><th>${t('th_observacion')}</th><th class="tright">${t('th_importe')}</th><th></th></tr></thead>
        <tbody>${filasExcluidos}</tbody></table>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><div><h3>${t('trimestral_publicados')}</h3></div></div>
      <div class="panel-body" style="padding:0;">
        <table><thead><tr><th>${t('th_expediente')}</th><th>${t('th_observacion')}</th><th>${t('form_publicacion_fecha')}</th><th>${t('form_publicacion_usuario')}</th></tr></thead>
        <tbody>${filasPublicados}</tbody></table>
      </div>
    </div>
  `;
}

/* =========================================================================
   RENDER — PUBLICACIÓN TRIMESTRAL
   ========================================================================= */

function renderTrimestral(state){
  const { anio, trimestre } = state.trimestral;
  const anios = Array.from(new Set(state.expedientes.filter(e=>e.fechaAdjudicacion).map(e=> new Date(e.fechaAdjudicacion).getFullYear()))).sort((a,b)=>b-a);
  if(!anios.includes(new Date().getFullYear())) anios.unshift(new Date().getFullYear());

  const lista = expedientesDelTrimestre(state.expedientes, anio, trimestre)
    .slice().sort((a,b)=> (a.adjudicatario?a.adjudicatario.empresa:'').localeCompare(b.adjudicatario?b.adjudicatario.empresa:''));

  const pendientes = lista.filter(e=> !e.publicacion && !esExcluidoPublicidad(e));

  const filas = lista.length ? lista.map(e => {
    const fisc = calcularFiscal(e);
    const excluido = esExcluidoPublicidad(e);
    return `
    <tr>
      <td>${e.adjudicatario?escapeHTML(e.adjudicatario.empresa):'—'}</td>
      <td>${e.adjudicatario?escapeHTML(e.adjudicatario.nif):'—'}</td>
      <td>${escapeHTML(e.numero)}</td>
      <td>${escapeHTML(e.objeto.slice(0,44))}${e.objeto.length>44?'…':''}</td>
      <td>${e.duracionMeses}</td>
      <td class="num">${fmtEUR(fisc.totalConIva)}</td>
      <td>${fmtDate(e.fechaAdjudicacion)}</td>
      <td>${excluido ? `<span class="badge-excluido">${t('trimestral_excluidos')}</span>` : (e.publicacion ? `<span class="chip ok">${t('trimestral_publicados')}</span>` : `<span class="chip aviso">${t('trimestral_pendientes')}</span>`)}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="8" style="color:var(--ink-soft);">${t('trimestral_sin_datos')}</td></tr>`;

  return `
    <div class="trimestral-controls">
      <label style="font-size:12.5px; color:var(--ink-soft);">${t('trimestral_anio')}</label>
      <select onchange="App.setTrimestral('anio', this.value)">
        ${anios.map(a=>`<option value="${a}" ${a===anio?'selected':''}>${a}</option>`).join('')}
      </select>
      <label style="font-size:12.5px; color:var(--ink-soft);">${t('trimestral_trimestre')}</label>
      <select onchange="App.setTrimestral('trimestre', this.value)">
        ${TRIMESTRES.map(q=>`<option value="${q.id}" ${q.id===trimestre?'selected':''}>${t(q.label)}</option>`).join('')}
      </select>
      <button class="btn secondary" onclick="App.generarSalidaTrimestral()">${t('trimestral_generar')}</button>
      <button class="btn gold" ${pendientes.length===0?'disabled':''} onclick="App.publicarPendientesTrimestre()">${t('trimestral_marcar_todos')} (${pendientes.length})</button>
    </div>
    <div class="panel">
      <div class="panel-body" style="padding:0;">
        <table>
          <thead><tr><th>${t('th_adjudicatario')}</th><th>${t('th_nif')}</th><th>${t('th_expediente')}</th><th>${t('publicidad_objeto')}</th><th>${t('th_duracion')}</th><th class="tright">${t('th_importe')}</th><th>${t('th_fecha_adjudicacion')}</th><th>${t('th_situacion')}</th></tr></thead>
          <tbody>${filas}</tbody>
        </table>
      </div>
    </div>
  `;
}

/* =========================================================================
   RENDER — FISCALIDAD Y MODELO 347
   ========================================================================= */

function renderFiscalidad(state){
  const all = state.expedientes;
  const filas = all.map(e => {
    const fisc = calcularFiscal(e);
    return `
    <tr>
      <td>${escapeHTML(e.numero)}</td>
      <td>${e.adjudicatario?escapeHTML(e.adjudicatario.empresa):'—'}</td>
      <td>${e.adjudicatario?escapeHTML(categoriaFiscalLabel(e.adjudicatario.categoriaFiscal)):'—'}</td>
      <td class="num">${fmtEUR(fisc.base)}</td>
      <td class="num">${fisc.ivaRate}%</td>
      <td class="num">${fmtEUR(fisc.retencion)}</td>
      <td class="num"><strong>${fmtEUR(fisc.neto)}</strong></td>
    </tr>`;
  }).join('');

  const r347 = resumen347(all);
  const filas347 = r347.length ? r347.map(r => `
    <tr>
      <td>${escapeHTML(r.empresa)}</td><td>${escapeHTML(r.nif)}</td>
      <td class="num">${fmtEUR(r.total)}</td>
      <td>${r.obligacion?`<span class="chip aviso">${t('sujeto_declaracion')}</span>`:`<span class="chip ok">${t('no_alcanza_umbral')}</span>`}</td>
    </tr>`).join('') : `<tr><td colspan="4" style="color:var(--ink-soft);">—</td></tr>`;

  return `
    <div class="panel" style="margin-bottom:20px;">
      <div class="panel-head"><div><h3>${t('title_fiscalidad')}</h3></div></div>
      <div class="panel-body" style="padding:0;">
        <table>
          <thead><tr><th>${t('th_expediente')}</th><th>${t('th_adjudicatario')}</th><th>${t('th_categoria')}</th><th class="tright">${t('th_base')}</th><th class="tright">${t('lbl_iva')}</th><th class="tright">${t('lbl_retencion')}</th><th class="tright">${t('lbl_neto')}</th></tr></thead>
          <tbody>${filas}</tbody>
        </table>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><div><h3>${t('nav_fiscalidad')}</h3><div class="hint">${t('umbral347_desc',{umbral:fmtEUR(CONFIG.umbral347)})}</div></div></div>
      <div class="panel-body" style="padding:0;">
        <table>
          <thead><tr><th>${t('th_proveedor')}</th><th>${t('th_nif')}</th><th class="tright">${t('th_acumulado')}</th><th>${t('th_situacion')}</th></tr></thead>
          <tbody>${filas347}</tbody>
        </table>
      </div>
    </div>
  `;
}

/* =========================================================================
   RENDER — UMBRALES Y FRACCIONAMIENTO (multidimensional)
   ========================================================================= */

function bloqueUmbral(titulo, subt, acumulado, filasRel){
  const pct = Math.min(100, Math.round(acumulado.ratio*100));
  const cls = acumulado.ratio>=1 ? 'bad' : (acumulado.ratio>=0.85 ? 'warn' : '');
  const nivel = acumulado.ratio>=1 ? `<span class="chip bloqueante">${t('chip_bloqueante')}</span>` : (acumulado.ratio>=0.85 ? `<span class="chip aviso">${t('chip_aviso')}</span>` : `<span class="chip ok">${t('chip_conforme')}</span>`);
  return `
    <div class="panel" style="margin-bottom:16px;">
      <div class="panel-head">
        <div><h3>${escapeHTML(titulo)}</h3><div class="hint">${escapeHTML(subt)}</div></div>
        ${nivel}
      </div>
      <div class="panel-body">
        <div style="display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:6px;">
          <span>${t('umbrales_acumulado')}</span>
          <span class="num">${fmtEUR(acumulado.total)} / ${fmtEUR(acumulado.limite)} (${pct}%)</span>
        </div>
        <div class="progress ${cls}" style="margin-bottom:14px;"><div style="width:${pct}%;"></div></div>
        <table><thead><tr><th>${t('th_expediente')}</th><th>${t('th_fecha_inicio')}</th><th class="tright">${t('th_base')}</th></tr></thead>
        <tbody>${filasRel.map(e=>`<tr><td>${escapeHTML(e.numero)}</td><td>${fmtDate(e.fechaInicio)}</td><td class="num">${fmtEUR(e.base)}</td></tr>`).join('')}</tbody></table>
      </div>
    </div>`;
}

function renderUmbrales(state){
  const all = state.expedientes;

  const gruposFamilia = {};
  all.forEach(e => { const k=e.familia+'||'+e.tipo; if(!gruposFamilia[k]) gruposFamilia[k]=[]; gruposFamilia[k].push(e); });
  const bloquesFamilia = Object.values(gruposFamilia).map(list => {
    const ref = list.slice().sort((a,b)=> new Date(b.fechaInicio)-new Date(a.fechaInicio))[0];
    const ac = acumuladoPorFamilia(ref, all);
    return bloqueUmbral(familiaLabel(ref.familia), `${etiquetaTipo(ref.tipo)} · ${t('lbl_limite_legal')}: ${fmtEUR(limiteFor(ref.tipo))}`, ac, ac.relacionados);
  }).join('');

  const gruposProveedor = {};
  all.forEach(e => { if(!e.adjudicatario) return; const k=e.adjudicatario.nif+'||'+e.tipo; if(!gruposProveedor[k]) gruposProveedor[k]=[]; gruposProveedor[k].push(e); });
  const bloquesProveedor = Object.values(gruposProveedor).map(list => {
    const ref = list.slice().sort((a,b)=> new Date(b.fechaInicio)-new Date(a.fechaInicio))[0];
    const ac = acumuladoPorProveedor(ref, all);
    if(!ac) return '';
    return bloqueUmbral(`${ref.adjudicatario.empresa} (${ref.adjudicatario.nif})`, `${etiquetaTipo(ref.tipo)} · ${t('lbl_limite_legal')}: ${fmtEUR(limiteFor(ref.tipo))}`, ac, ac.relacionados);
  }).join('');

  const gruposCentro = {};
  all.forEach(e => { const k=e.departamento+'||'+e.familia+'||'+e.tipo; if(!gruposCentro[k]) gruposCentro[k]=[]; gruposCentro[k].push(e); });
  const bloquesCentro = Object.values(gruposCentro).map(list => {
    const ref = list.slice().sort((a,b)=> new Date(b.fechaInicio)-new Date(a.fechaInicio))[0];
    const ac = acumuladoPorCentroGestor(ref, all);
    return bloqueUmbral(`${departamentoLabel(ref.departamento)} — ${familiaLabel(ref.familia)}`, `${etiquetaTipo(ref.tipo)} · ${t('lbl_limite_legal')}: ${fmtEUR(limiteFor(ref.tipo))}`, ac, ac.relacionados);
  }).join('');

  return `
    <div class="tabs" style="padding:0; border:none; margin-bottom:16px; background:none;">
      <button class="tab-btn active" onclick="document.querySelectorAll('.umbral-block').forEach(x=>x.style.display='none'); document.getElementById('ub-familia').style.display='block';">${t('categoria_frac_familia')}</button>
      <button class="tab-btn" onclick="document.querySelectorAll('.umbral-block').forEach(x=>x.style.display='none'); document.getElementById('ub-proveedor').style.display='block';">${t('categoria_frac_proveedor')}</button>
      <button class="tab-btn" onclick="document.querySelectorAll('.umbral-block').forEach(x=>x.style.display='none'); document.getElementById('ub-centro').style.display='block';">${t('categoria_frac_centro')}</button>
    </div>
    <div id="ub-familia" class="umbral-block">${bloquesFamilia || `<div class="empty-state">—</div>`}</div>
    <div id="ub-proveedor" class="umbral-block" style="display:none;">${bloquesProveedor || `<div class="empty-state">—</div>`}</div>
    <div id="ub-centro" class="umbral-block" style="display:none;">${bloquesCentro || `<div class="empty-state">—</div>`}</div>
  `;
}
